<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Sentiment Analyze (Clickbait Dedection)</title>
    <link rel="stylesheet" href="style/main.css" />
    <link rel="stylesheet" href="style/media.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div id="loadingDiv" class="hidden">
      <p>
        Getting results, please wait...
      </p>
    </div>
    <div class="container">
      <h1 style="color: rgb(212, 57, 57)">YouTube Clickbait Analyze</h1>
      <p>Analyze the reactions in the video's comments with AI.</p>

      <div class="input-group">
        <p>Video link</p>
        <input
          type="text"
          id="youtubeUrl"
          placeholder="https://youtube.com/watch?v=..."
        />
        <button id="analyzeBtn">Analyze</button>
      </div>

      <div id="errorDiv" class="box hidden error-box"></div>

      <div id="resultDiv" class="box hidden">
        <h2 id="videoTitle"></h2>

        <div class="stats-grid">
          <div class="stat-box">
            <h3>Overall Choice by AI</h3>
            <p id="overallSentiment" class="score"></p>
          </div>
          <div class="stat-box">
            <h3>Clickbait Score</h3>
            <p id="clickbaitScore" class="score"></p>
            <div id="levelOut">
              <div id="levelIn"></div>
            </div>
          </div>
          <div id="sourceDiv" class="stat-box">
            <h3>Source</h3>
            <p id="dataSource" class="score"></p>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <a href="rankings.html"
        >View monthly ranking among the analyzed videos<i
          class="icon fa-solid fa-square-arrow-up-right"
        ></i
      ></a>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
