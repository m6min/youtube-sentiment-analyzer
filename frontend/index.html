<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Sentiment Analyze (Clickbait Dedection)</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <h1 style="color: rgb(212, 57, 57);">YouTube Clickbait Analyze</h1>
        <p>Analyze the reactions in the video's comments with AI.</p>
        
        <div class="input-group">
            <p>Video link</p>
            <input type="text" id="youtubeUrl" placeholder="https://youtube.com/watch?v=...">
            <button id="analyzeBtn">Analyze</button>
        </div>


        <div id="loadingDiv" class="hidden">
            <p>Getting results, please wait <span class="d1">.</span><span class="d2">.</span><span class="d3">.</span></p>
        </div>


        <div id="errorDiv" class="hidden error-box"></div>

        <div id="resultDiv" class="hidden">
            <h2 id="videoTitle"></h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <h3>Overall Choice by AI</h3>
                    <p id="overallSentiment" class="score"></p>
                </div>
                <div class="stat-box">
                    <h3>Clickbait Score</h3>
                    <p id="clickbaitScore" class="score"></p>
                </div>
                <div class="stat-box">
                    <h3>Number of comments analyzed</h3>
                    <p id="commentCount" class="score"></p>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <a href="#">View monthly ranking among the analyzed videos<i class="icon fa-solid fa-square-arrow-up-right"></i></a>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
