services:
  db:
    image: postgres:15-alpine
    container_name: youtube_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: youtube_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_SERVER=db
      - ALLOWED_ORIGINS=http://localhost:5500,http://127.0.0.1:5500
    depends_on:
      - db

volumes:
  postgres_data: